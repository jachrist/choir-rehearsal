[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choir-rehearsal"
version = "0.0.1"
description = "OMR-pipeline: fra PDF-noter til korrekt MusicXML for korøving"
readme = "README.md"
requires-python = ">=3.11"
# Lette kjerneavhengigheter. Tunge OMR-avhengigheter (homr, torch) legges til
# i Fase 1 via extra-en [omr] slik at grunnoppsettet er raskt.
dependencies = [
    "pymupdf>=1.24",
    "lxml>=5.0",
]

[project.scripts]
choir-omr = "choir_rehearsal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Fase 1: OMR-motor. Installeres separat pga. størrelse (torch m.m.).
#   pip install -e ".[omr]"
# Merk: på Debian-baserte miljøer kan antlr4-python3-runtime feile å bygge;
# sett da SETUPTOOLS_USE_DISTUTILS=stdlib før installasjon.
omr = [
    "homr>=0.7",
]
# Fase 4: lokalt web-verktøy for sangtekstretting.
# (Verovio lager SVG som nettleseren viser direkte – ingen cairosvg/Cairo nødvendig.)
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "verovio>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"choir_rehearsal.ui" = ["static/*.html"]

[tool.pytest.ini_options]
# src-layout: gjør pakken importerbar i tester uten editable-install
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tester som krever tunge modeller (homr/vision); kjøres sjeldnere",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
